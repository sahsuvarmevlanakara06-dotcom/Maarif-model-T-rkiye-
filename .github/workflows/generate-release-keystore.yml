name: 1. Release Keystore Olustur (Tek Seferlik)

on:
  workflow_dispatch:
    inputs:
      owner_name:
        description: 'Gelistirici veya Uygulama Sahibi Adi (Ornek: Maarif Portal)'
        required: true
        default: 'Maarif Portal'
      country_code:
        description: 'Ulke Kodu (2 harf, Ornek: TR)'
        required: true
        default: 'TR'

jobs:
  generate-keystore:
    name: Release Keystore ve Firebase SHA Uret
    runs-on: ubuntu-latest

    steps:
      - name: JDK 21 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Secret Kontrolleri
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Lutfen once GitHub Repo Settings > Secrets and variables > Actions bolumune STORE_PASSWORD ve KEY_PASSWORD ekleyin (en az 6 karakter)."
            exit 1
          fi
          if [ ${#STORE_PASSWORD} -lt 6 ] || [ ${#KEY_PASSWORD} -lt 6 ]; then
            echo "::error::STORE_PASSWORD ve KEY_PASSWORD en az 6 karakter olmalidir."
            exit 1
          fi

      - name: Release Keystore (.jks) ve SHA-1 / SHA-256 Olustur
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          OWNER_NAME: ${{ inputs.owner_name }}
          COUNTRY_CODE: ${{ inputs.country_code }}
        run: |
          mkdir -p keystore-output
          keytool -genkeypair -v \
            -keystore keystore-output/my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=${OWNER_NAME}, OU=Mobile, O=${OWNER_NAME}, L=Ankara, S=Ankara, C=${COUNTRY_CODE}"

          base64 -w 0 keystore-output/my-upload-key.jks > keystore-output/KEYSTORE_BASE64.txt

          SHA1=$(keytool -list -v -keystore keystore-output/my-upload-key.jks -alias upload -storepass "$STORE_PASSWORD" | grep "SHA1:" | awk '{print $2}')
          SHA256=$(keytool -list -v -keystore keystore-output/my-upload-key.jks -alias upload -storepass "$STORE_PASSWORD" | grep "SHA256:" | awk '{print $2}')

          cat <<EOF > keystore-output/FIREBASE_SHA_FINGERPRINTS.txt
          Uygulama Paket Adi: com.aistudio.maarifportal.qkzrtx
          Key Alias: upload
          SHA-1:   ${SHA1}
          SHA-256: ${SHA256}
          EOF

          {
            echo "## Release Keystore Basariyla Olusturuldu"
            echo ""
            echo "### 1. Firebase Console'a Eklenecek Parmak Izleri"
            echo "- **Paket Adi:** \`com.aistudio.maarifportal.qkzrtx\`"
            echo "- **SHA-1:** \`${SHA1}\`"
            echo "- **SHA-256:** \`${SHA256}\`"
            echo ""
            echo "### 2. Siradaki Adimlar (Tabletten)"
            echo "1. Asagidaki **maarif-release-keystore** dosyasini indirip guvenli bir yerde (Google Drive vb.) saklayin."
            echo "2. Indirdiginiz ZIP icindeki \`KEYSTORE_BASE64.txt\` dosyasinin tum icerigini kopyalayin."
            echo "3. GitHub'da **Settings > Secrets and variables > Actions** bolumune \`KEYSTORE_BASE64\` adiyla yeni bir Secret ekleyin."
            echo "4. Yukaridaki SHA-1 ve SHA-256 kodlarini Firebase Console'a ekleyip guncel \`google-services.json\` dosyasini \`app/google-services.json\` uzerine yukleyin."
            echo "5. Ardindan **2. Samsung Galaxy Store Release APK Derle** is akisini calistirin."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keystore Paketini Indirilebilir Artifact Olarak Yukle
        uses: actions/upload-artifact@v4
        with:
          name: maarif-release-keystore
          path: keystore-output/
          retention-days: 7
